# 릴스·쇼츠 차단기 - 이 파일 하나만 올리면 GitHub가 앱(APK)을 만들어 줍니다.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create project files
        run: |
          mkdir -p p/app/src/main/java/com/example/reelsblocker p/app/src/main/res/xml p/app/src/main/res/values
          cd p

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ReelsBlocker"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.reelsblocker"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.reelsblocker"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@android:drawable/ic_lock_lock"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlockerService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">릴스·쇼츠 차단기</string>
              <string name="service_description">인스타그램 릴스와 유튜브 쇼츠 화면이 열리면 자동으로 뒤로 가기를 눌러 차단합니다. 화면 내용은 저장하거나 전송하지 않습니다.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled"
              android:packageNames="com.instagram.android,com.google.android.youtube"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="150"
              android:description="@string/service_description" />
          EOF

          cat > app/src/main/java/com/example/reelsblocker/BlockerService.kt <<'EOF'
          package com.example.reelsblocker

          import android.accessibilityservice.AccessibilityService
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast

          class BlockerService : AccessibilityService() {

              // 릴스/쇼츠 화면에만 있는 뷰 ID. 앱 업데이트로 바뀌면 여기만 고치면 됨.
              private val targets = mapOf(
                  "com.instagram.android" to listOf(
                      "clips_viewer_view_pager",
                      "clips_viewer_pager",
                  ),
                  "com.google.android.youtube" to listOf(
                      "reel_recycler",
                      "reel_player_page_container",
                      "reel_watch_player",
                  ),
              )

              private var lastCheck = 0L
              private var lastBlock = 0L

              override fun onAccessibilityEvent(event: AccessibilityEvent) {
                  val pkg = event.packageName?.toString() ?: return
                  val ids = targets[pkg] ?: return

                  val now = SystemClock.uptimeMillis()
                  if (now - lastBlock < 1000) return
                  if (event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                      now - lastCheck < 250) return
                  lastCheck = now

                  val root = rootInActiveWindow ?: return
                  val found = ids.any { id ->
                      root.findAccessibilityNodeInfosByViewId("$pkg:id/$id")
                          .any { it.isVisibleToUser }
                  }

                  if (found) {
                      lastBlock = now
                      performGlobalAction(GLOBAL_ACTION_BACK)
                      val name = if (pkg.contains("instagram")) "릴스" else "쇼츠"
                      Toast.makeText(this, "$name 차단됨", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onInterrupt() {}
          }
          EOF

          cat > app/src/main/java/com/example/reelsblocker/MainActivity.kt <<'EOF'
          package com.example.reelsblocker

          import android.app.Activity
          import android.content.ComponentName
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  status = TextView(this).apply { textSize = 20f; gravity = Gravity.CENTER }
                  val button = Button(this).apply {
                      text = "접근성 설정 열기"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  }
                  val help = TextView(this).apply {
                      textSize = 14f
                      gravity = Gravity.CENTER
                      text = "접근성 → 설치된 앱 → '릴스·쇼츠 차단기'를 켜 주세요.\n끌 때도 같은 곳에서 끄면 됩니다."
                  }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(64, 64, 64, 64)
                      addView(status); addView(button); addView(help)
                  })
              }

              override fun onResume() {
                  super.onResume()
                  status.text = if (isServiceOn()) "✅ 차단 켜짐" else "⛔ 차단 꺼짐"
              }

              private fun isServiceOn(): Boolean {
                  val me = ComponentName(this, BlockerService::class.java).flattenToString()
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabled.split(':').any { it.equals(me, ignoreCase = true) }
              }
          }
          EOF

      - name: Build APK
        working-directory: p
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ReelsBlocker.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 릴스·쇼츠 차단기 v${{ github.run_number }}
          files: ReelsBlocker.apk
