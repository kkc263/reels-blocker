          cat > $K/Prefs.kt <<'EOF'
          package com.example.reelsblocker

          import android.content.Context
          import android.content.SharedPreferences
          import java.time.LocalDate

          /** 앱 설정과 차단 기록 (폰 안에만 저장됨) */
          object Prefs {
              private fun p(ctx: Context): SharedPreferences =
                  ctx.getSharedPreferences("blocker", Context.MODE_PRIVATE)

              fun enabled(ctx: Context) = p(ctx).getBoolean("enabled", true)
              fun setEnabled(ctx: Context, on: Boolean) =
                  p(ctx).edit().putBoolean("enabled", on).putLong("pause_until", 0L).apply()

              fun blockIg(ctx: Context) = p(ctx).getBoolean("block_ig", true)
              fun setBlockIg(ctx: Context, on: Boolean) = p(ctx).edit().putBoolean("block_ig", on).apply()
              fun blockYt(ctx: Context) = p(ctx).getBoolean("block_yt", true)
              fun setBlockYt(ctx: Context, on: Boolean) = p(ctx).edit().putBoolean("block_yt", on).apply()

              fun pauseUntil(ctx: Context) = p(ctx).getLong("pause_until", 0L)
              fun pauseFor(ctx: Context, minutes: Int) =
                  p(ctx).edit().putLong("pause_until", System.currentTimeMillis() + minutes * 60_000L).apply()
              fun isPaused(ctx: Context) = pauseUntil(ctx) > System.currentTimeMillis()
              fun isActive(ctx: Context) = enabled(ctx) && !isPaused(ctx)

              fun todayCount(ctx: Context): Int {
                  val pr = p(ctx)
                  return if (pr.getString("day", "") == LocalDate.now().toString()) pr.getInt("today", 0) else 0
              }
              fun totalCount(ctx: Context) = p(ctx).getInt("total", 0)
              fun igCount(ctx: Context) = p(ctx).getInt("total_ig", 0)
              fun ytCount(ctx: Context) = p(ctx).getInt("total_yt", 0)

              fun addBlock(ctx: Context, isIg: Boolean) {
                  val pr = p(ctx)
                  val today = LocalDate.now().toString()
                  val t = if (pr.getString("day", "") == today) pr.getInt("today", 0) else 0
                  val key = if (isIg) "total_ig" else "total_yt"
                  pr.edit().putString("day", today).putInt("today", t + 1)
                      .putInt("total", pr.getInt("total", 0) + 1)
                      .putInt(key, pr.getInt(key, 0) + 1).apply()
              }
          }
          EOF

          cat > $K/BlockerService.kt <<'EOF'
          package com.example.reelsblocker

          import android.accessibilityservice.AccessibilityService
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast

          class BlockerService : AccessibilityService() {

              private val IG = "com.instagram.android"
              private val YT = "com.google.android.youtube"

              // 릴스/쇼츠 화면에만 있는 뷰 ID. 앱 업데이트로 바뀌면 여기만 고치면 됨.
              private val targets = mapOf(
                  IG to listOf("clips_viewer_view_pager", "clips_viewer_pager"),
                  YT to listOf("reel_recycler", "reel_player_page_container", "reel_watch_player"),
              )

              private var lastCheck = 0L
              private var lastBlock = 0L

              override fun onAccessibilityEvent(event: AccessibilityEvent) {
                  val pkg = event.packageName?.toString() ?: return
                  val ids = targets[pkg] ?: return
                  if (!Prefs.isActive(this)) return
                  if (pkg == IG && !Prefs.blockIg(this)) return
                  if (pkg == YT && !Prefs.blockYt(this)) return

                  val now = SystemClock.uptimeMillis()
                  if (now - lastBlock < 1000) return
                  if (event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                      now - lastCheck < 250) return
                  lastCheck = now

                  val root = rootInActiveWindow ?: return
                  val found = ids.any { id ->
                      root.findAccessibilityNodeInfosByViewId("$pkg:id/$id").any { it.isVisibleToUser }
                  }

                  if (found) {
                      lastBlock = now
                      performGlobalAction(GLOBAL_ACTION_BACK)
                      Prefs.addBlock(this, pkg == IG)
                      val name = if (pkg == IG) "릴스" else "쇼츠"
                      Toast.makeText(this, "🛡 $name 차단 · 오늘 ${Prefs.todayCount(this)}번째", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onInterrupt() {}
          }
