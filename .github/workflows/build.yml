              // ================= 상태 반영 =================
              private fun refresh() {
                  if (!::ring.isInitialized) return
                  val serviceOn = isServiceOn()
                  val enabled = Prefs.enabled(this)
                  val paused = Prefs.isPaused(this)
                  val active = serviceOn && enabled && !paused

                  warnCard.visibility = if (serviceOn) View.GONE else View.VISIBLE
                  ring.state = when { active -> PowerRingView.ON; paused && serviceOn -> PowerRingView.PAUSED; else -> PowerRingView.OFF }
                  ring.title = when { !serviceOn -> "권한 필요"; paused -> "쉬는 중"; enabled -> "보호 중"; else -> "꺼짐" }
                  ringSub.text = when {
                      !serviceOn -> "위의 버튼으로 접근성 권한을 켜 주세요"
                      paused -> {
                          val left = (Prefs.pauseUntil(this) - System.currentTimeMillis()) / 1000
                          "%d:%02d 뒤에 다시 보호돼요".format(left / 60, left % 60)
                      }
                      enabled -> "릴스·쇼츠를 열면 자동으로 닫혀요"
                      else -> "동그라미를 누르면 다시 켜져요"
                  }

                  val today = Prefs.todayCount(this)
                  val total = Prefs.totalCount(this)
                  todayHome.text = "${today}번"
                  totalHome.text = "${total}번"
                  todayBig.text = today.toString()
                  igNum.text = Prefs.igCount(this).toString()
                  ytNum.text = Prefs.ytCount(this).toString()
                  totalNum.text = "${total}번"

                  accState.text = if (serviceOn) "켜짐" else "꺼짐 · 눌러서 켜기"
                  accState.setTextColor(if (serviceOn) green else amber)

                  pauseCard.visibility = if (enabled || paused) View.VISIBLE else View.GONE
                  pauseRow.visibility = if (paused) View.GONE else View.VISIBLE
                  resumeBtn.visibility = if (paused) View.VISIBLE else View.GONE
              }

              private fun refreshTile() {
                  try {
                      TileService.requestListeningState(this, ComponentName(this, ToggleTile::class.java))
                  } catch (_: Exception) {}
              }

              private fun addTile() {
                  if (Build.VERSION.SDK_INT < 33) {
                      Toast.makeText(this, "알림창을 내리고 연필(편집) → '릴스 차단'을 끌어다 놓으세요", Toast.LENGTH_LONG).show()
                      return
                  }
                  val sbm = getSystemService(StatusBarManager::class.java) ?: return
                  sbm.requestAddTileService(
                      ComponentName(this, ToggleTile::class.java), "릴스 차단",
                      Icon.createWithResource(this, R.drawable.ic_tile), mainExecutor
                  ) { result ->
                      val msg = when (result) {
                          StatusBarManager.TILE_ADD_REQUEST_RESULT_TILE_ADDED -> "추가됐어요! 알림창을 내려 보세요"
                          StatusBarManager.TILE_ADD_REQUEST_RESULT_TILE_ALREADY_ADDED -> "이미 추가돼 있어요"
                          else -> "추가하지 않았어요"
                      }
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                  }
              }

              private fun isServiceOn(): Boolean {
                  val me = ComponentName(this, BlockerService::class.java).flattenToString()
                  val list = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                      ?: return false
                  return list.split(':').any { it.equals(me, ignoreCase = true) }
              }
          }
          EOF

      - name: Build APK
        working-directory: p
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ReelsBlocker.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 릴스·쇼츠 차단기 v${{ github.run_number }}
          files: ReelsBlocker.apk
