          package com.example.reelsblocker

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.graphics.SweepGradient
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.min

          /** 빛나는 원형 전원 버튼 */
          class PowerRingView(ctx: Context) : View(ctx) {

              companion object { const val ON = 0; const val PAUSED = 1; const val OFF = 2 }

              var state = ON
                  set(v) { field = v; invalidate() }
              var title = ""
                  set(v) { field = v; invalidate() }

              private val icOn: Drawable = ctx.getDrawable(R.drawable.ic_shield_check)!!.mutate()
              private val icPause: Drawable = ctx.getDrawable(R.drawable.ic_pause)!!.mutate()
              private val icOff: Drawable = ctx.getDrawable(R.drawable.ic_shield)!!.mutate()

              private val d = resources.displayMetrics.density
              private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }
              private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val glowPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE; textAlign = Paint.Align.CENTER; typeface = Typeface.DEFAULT_BOLD
              }
              private var angle = 0f
              private val spin = ValueAnimator.ofFloat(0f, 360f).apply {
                  duration = 6000; repeatCount = ValueAnimator.INFINITE; interpolator = LinearInterpolator()
                  addUpdateListener { angle = it.animatedValue as Float; invalidate() }
              }

              override fun onAttachedToWindow() { super.onAttachedToWindow(); spin.start() }
              override fun onDetachedFromWindow() { spin.cancel(); super.onDetachedFromWindow() }

              override fun onDraw(c: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val glowW = 26 * d
                  val r = min(width, height) / 2f - glowW

                  val ring: IntArray
                  val glow: Int
                  val iconColor: Int
                  val icon: Drawable
                  when (state) {
                      ON -> {
                          ring = intArrayOf(0xFF22D3EE.toInt(), 0xFF3B82F6.toInt(), 0xFF6366F1.toInt(), 0xFF22D3EE.toInt())
                          glow = Color.argb(110, 59, 130, 246); iconColor = 0xFF7CC4FF.toInt(); icon = icOn
                      }
                      PAUSED -> {
                          ring = intArrayOf(0xFFFBBF24.toInt(), 0xFFF59E0B.toInt(), 0xFFFBBF24.toInt())
                          glow = Color.argb(90, 245, 158, 11); iconColor = 0xFFFCD34D.toInt(); icon = icPause
                      }
                      else -> {
                          ring = intArrayOf(0x33FFFFFF, 0x22FFFFFF, 0x33FFFFFF)
                          glow = Color.TRANSPARENT; iconColor = 0xFF6F84AD.toInt(); icon = icOff
                      }
                  }

                  // 바깥 빛
                  if (glow != Color.TRANSPARENT) {
                      glowPaint.shader = RadialGradient(
                          cx, cy, r + glowW, intArrayOf(glow, glow, Color.TRANSPARENT),
                          floatArrayOf(0f, r / (r + glowW), 1f), Shader.TileMode.CLAMP
                      )
                      c.drawCircle(cx, cy, r + glowW, glowPaint)
                  }
                  // 안쪽 원
                  fillPaint.shader = RadialGradient(
                      cx, cy - r * 0.35f, r * 1.3f, 0xFF1C3A78.toInt(), 0xFF0A1633.toInt(), Shader.TileMode.CLAMP
                  )
                  c.drawCircle(cx, cy, r, fillPaint)
                  // 회전하는 테두리
                  ringPaint.strokeWidth = 6 * d
                  ringPaint.shader = SweepGradient(cx, cy, ring, null)
                  c.save()
                  if (state == ON) c.rotate(angle, cx, cy)
                  c.drawCircle(cx, cy, r, ringPaint)
                  c.restore()
                  // 아이콘 + 글자
                  val s = (r * 0.5f).toInt()
                  icon.setTint(iconColor)
                  icon.setBounds((cx - s / 2).toInt(), (cy - s * 0.9f).toInt(), (cx + s / 2).toInt(), (cy + s * 0.1f).toInt())
                  icon.draw(c)
                  textPaint.textSize = 19 * d
                  c.drawText(title, cx, cy + s * 0.1f + 30 * d, textPaint)
              }
          }
          EOF

